# Tiny Tapeout project information
project:
  title:        "4-Neuron LIF Spiking Neural Network"
  author:       "Martin Flores"
  discord:      ""
  description:  "A simple 4-neuron spiking neural network implementing the LIF model"
  language:     "Verilog"
  clock_hz:     10000000

  tiles: "1x2"

  top_module:  "tt_um_wallace_multiplier_serial"

  source_files:
    - "project.v"
    - "24b_multiplier_adapted.v"

pinout:
  # Inputs
  ui[0]: "data_in[0]"
  ui[1]: "data_in[1]"
  ui[2]: "data_in[2]"
  ui[3]: "data_in[3]"
  ui[4]: "data_in[4]"
  ui[5]: "data_in[5]"
  ui[6]: "data_in[6]"
  ui[7]: "data_in[7]"

  # Outputs
  uo[0]: "data_out[0]"
  uo[1]: "data_out[1]"
  uo[2]: "data_out[2]"
  uo[3]: "data_out[3]"
  uo[4]: "data_out[4]"
  uo[5]: "data_out[5]"
  uo[6]: "data_out[6]"
  uo[7]: "data_out[7]"

  # Bidirectional pins — outputs
  uio[0]: "v_mem[0] — membrane potential of observed neuron"
  uio[1]: "v_mem[1]"
  uio[2]: "v_mem[2]"
  uio[3]: "v_mem[3]"
  uio[4]: "v_mem[4]"
  uio[5]: "v_mem[5]"
  uio[6]: "v_mem[6]"
  uio[7]: "v_mem[7] — sign bit"

# Do not change!
yaml_version: 6
